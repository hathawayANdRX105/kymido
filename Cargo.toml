[workspace]
members = [
  "bin/kymic", "bin/web",
  "crates/daemon", "crates/protocol", "crates/llm", "crates/mcp",
  "crates/agent-loop", "crates/tools", "crates/subagent",
  "crates/skill", "crates/plan-mode", "crates/guard",
  "crates/jobs", "crates/terminal", "crates/store",
  "crates/memory", "crates/session", "crates/plugin",
  "crates/config", "crates/prompts",
  "crates/web-client", "crates/web-state", "crates/web-ui",
  "crates/tui",
  "crates/wire",
  "crates/web-tool",
]
resolver = "2"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
toml = "0.8"
base64 = "0.22"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
thiserror = "2"
anyhow = "1"
pulldown-cmark = "0.13"
ammonia = "4"
ctrlc = "3"
diffy = "0.5"
ratatui = "0.30"
crossterm = "0.29"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true