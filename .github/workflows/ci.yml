name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      # Full history on purpose: the scope step needs a merge base (PR:
      # origin/<base>...HEAD; push: the pre-push tip) and `git diff` needs
      # it, which the default depth-1 checkout does not have
      # (run 36297455244: "no merge base", exit 128).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Private git dep (ui-kit): the runner has no deploy key and GITHUB_TOKEN
      # cannot reach private repos of a public-repo event. The UIKIT_PAT secret
      # (fine-grained, ui-kit read only) is injected into the git URL; cargo
      # uses the git CLI so the url.insteadOf rewrites apply. The dep URL in
      # Cargo.toml is https-addressed, so BOTH the ssh- and https-prefix
      # rewrites are registered — the ssh-only rewrite silently matched nothing
      # and every run since the https pin failed the fetch with exit 128
      # (anon https fetch of a private repo, run 36896427859).
      - name: Allow cargo to fetch private git deps
        env:
          UIKIT_PAT: ${{ secrets.UIKIT_PAT }}
        run: |
          git config --global url."https://x-access-token:${UIKIT_PAT}@github.com/hathawayANdRX105/".insteadOf "ssh://git@github.com/hathawayANdRX105/"
          git config --global url."https://x-access-token:${UIKIT_PAT}@github.com/hathawayANdRX105/".insteadOf "https://github.com/hathawayANdRX105/"
      - name: Install system deps (ripgrep for tools tests, sccache for rustc-wrapper)
        # .cargo/config.toml 钉了 rustc-wrapper = sccache（7ae8568 起本地
        # 多会话编译缓存），runner 无 sccache 时 cargo 直接 exit 101。
        run: sudo apt-get update && sudo apt-get install -y ripgrep sccache
      # `web` bin 的 build.rs 在 bin/web 跑 Tailwind CLI（`node_modules/.bin/
      # tailwindcss`），node_modules 不跟 git（CI 全新 checkout 没有）——不装则
      # Tailwind 产物 0 字节、护栏硬失败（run 36904776053：Can't resolve
      # 'tailwindcss'）。runner 镜像无 bun（run 36906279179：command not
      # found），用 npm ci（package-lock.json 确定性）；本地 dev 惯例仍是 bun。
      - name: Install bin/web frontend deps (tailwind build.rs)
        run: cd bin/web && npm ci --no-audit --no-fund
      # Scope by the diff through the shared resolver (`scripts/ci_scope.py`,
      # byte-identical in ferrite), which answers three questions at once:
      # which crates own the changed files, what depends on them (reverse
      # closure over `cargo metadata --no-deps` path edges), and whether
      # anything moves the whole graph (root manifest, toolchain, orphan
      # `.rs`). Docs, workflow and gate-rule edits now SKIP instead of
      # paying for the full workspace — that fallback used to be 53% of runs.
      #
      # `--no-deps` never resolves the registry graph, so the private ui-kit
      # git dependency is never fetched (12 of this repo's failed runs died
      # on that authentication); `CARGO_NET_OFFLINE` makes it impossible to
      # try. Outputs: `skip` / `full` / `names` (concrete package list, all
      # members when FULL, empty when skipping) / `seed` / `reason`.
      - name: Resolve affected crates
        id: scope
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          # PR: make sure the base branch is local (the resolver diffs the
          # merge base of origin/<base> and HEAD; a push already has
          # `github.event.before` in the full-history checkout).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
          fi
          python3 scripts/ci_scope.py --format github \
            --seed '.githooks/spec/**=web' \
            --also daemon=subagent
      # `names` is always the concrete package list (all members when FULL,
      # empty when SKIP), so the same array drives build and test and an `if:`
      # can token-match a single crate without a `__ALL__` sentinel.
      - name: Build (affected crates)
        if: steps.scope.outputs.skip == 'false' && steps.scope.outputs.full == 'false'
        run: |
          set -euo pipefail
          IFS=',' read -ra PKGS <<< "${{ steps.scope.outputs.names }}"
          # cargo takes one package per -p; build the repeated-arg array.
          ARGS=(); for p in "${PKGS[@]}"; do ARGS+=(-p "$p"); done
          cargo build --locked --all-targets "${ARGS[@]}"
      - name: Build (full workspace)
        if: steps.scope.outputs.full == 'true'
        run: cargo build --locked --all-targets
      - name: Build (nothing in scope)
        if: steps.scope.outputs.skip == 'true'
        run: echo "scope=skip — ${{ steps.scope.outputs.reason }}"
      # --no-fail-fast + per-test-binary output so a hang shows which
      # binary stalled instead of the whole step going dark. The timeout
      # stops a hung binary from burning the whole job budget, and the
      # output is tee'd so the "Name failing test binaries" step below can
      # turn a wall of `error: test failed` into one named repro command.
      - name: Test (affected crates)
        if: steps.scope.outputs.skip == 'false' && steps.scope.outputs.full == 'false'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          IFS=',' read -ra PKGS <<< "${{ steps.scope.outputs.names }}"
          ARGS=(); for p in "${PKGS[@]}"; do ARGS+=(-p "$p"); done
          cargo test --locked --all-targets --no-fail-fast "${ARGS[@]}" -- --test-threads=4 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Test (full workspace)
        if: steps.scope.outputs.full == 'true'
        timeout-minutes: 25
        run: cargo test --locked --all-targets --no-fail-fast -- --test-threads=4 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Test (nothing in scope)
        if: steps.scope.outputs.skip == 'true'
        run: echo "scope=skip — ${{ steps.scope.outputs.reason }}"
      # A red suite should name the binary rather than make the reader
      # infer it from `test result: FAILED` lines scrolled away above. The
      # log is the same one the test step tee'd, so this costs one pass over
      # a file; a failure before the test step (build, fmt) just notices that.
      - name: Name failing test binaries
        if: failure()
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/test.log"
          if [ ! -f "$LOG" ]; then
            echo "::notice title=failing test binary::no test log — the failure happened before the test step (build/fmt/scope)"
            exit 0
          fi
          python3 - "$LOG" <<'PY'
          import os, re, sys
          from pathlib import Path

          sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts"))
          import ci_scope

          log = Path(sys.argv[1])
          # libtest may colourise on a non-tty runner; strip CSI anyway so the
          # `Running …` / `test result:` pairs parse.
          text = re.sub(r"\x1b\[[0-9;?]*[ -/]*[@-~]", "", log.read_text(errors="replace"))

          running = None          # (source target, binary id) currently under test
          failed = []
          for line in text.splitlines():
              m = re.search(r"Running (\S+) \(target/[^\s)]*?/deps/([^)/]+)\)", line)
              if m:
                  running = (m.group(1), m.group(2))
              if "test result: FAILED" in line and running is not None:
                  failed.append(running)
                  running = None

          if not failed:
              print("::notice title=failing test binary::no `test result: FAILED` in the log — build/link/timeout, not a test")
              raise SystemExit(0)

          ws = ci_scope.Workspace(Path(os.environ["GITHUB_WORKSPACE"]))
          # target name -> (kind, package), so a failure prints the command
          # that reproduces just it: `--test foo` for an integration target,
          # `--bin foo` for a binary's unit tests, `-p pkg` for the lib.
          owner = {}
          for pkg, meta in ws.packages.items():
              for t in meta.get("targets", []):
                  kinds = t.get("kind", [])
                  if "test" in kinds:
                      owner[t["name"]] = ("test", pkg)
                  elif "lib" in kinds:
                      owner.setdefault(t["name"], ("lib", pkg))
                  elif "bin" in kinds:
                      owner.setdefault(t["name"], ("bin", pkg))
                  elif "example" in kinds:
                      owner.setdefault(t["name"], ("example", pkg))

          seen = set()
          for target, binary in failed:
              name = re.sub(r"[-_][0-9a-f]{16}$", "", binary)  # strip cargo's hash
              kind_pkg = owner.get(name)
              if kind_pkg is None:
                  repro = f"cargo test --locked --all-targets -- {name}"
                  where = target
              else:
                  kind, pkg = kind_pkg
                  repro = {
                      "test": f"cargo test --locked -p {pkg} --test {name} -- --nocapture",
                      "bin": f"cargo test --locked -p {pkg} --bin {name} -- --nocapture",
                      "example": f"cargo test --locked -p {pkg} --example {name} -- --nocapture",
                      "lib": f"cargo test --locked -p {pkg} --lib -- --nocapture",
                  }[kind]
                  where = f"{pkg} {target}"
              key = (name, repro)
              if key in seen:
                  continue
              seen.add(key)
              print(f"::error title=failing test binary::{name} ({where}) — local repro: {repro}")
          PY
      - name: Format check
        run: cargo fmt --all -- --check

  # Batch smoke: the TUI over a real daemon socket, in both renderers —
  # the linear pipe smoke and the enhanced pty smoke. Kept as its own job so
  # a feature-level regression names itself instead of hiding in the suite;
  # everything else the job used to re-run (plan_mode_e2e, profile_cli,
  # ui_contract) is covered by the test job's scope closure above.
  smoke:
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Private git dep (ui-kit) fetches with the UIKIT_PAT secret injected
      # into the git URL (runner has no deploy key; GITHUB_TOKEN of a
      # public-repo event cannot reach private repos). The dep URL in
      # Cargo.toml is https-addressed, so BOTH the ssh- and https-prefix
      # rewrites are registered — see the test job's step for the history.
      - name: Allow cargo to fetch private git deps
        env:
          UIKIT_PAT: ${{ secrets.UIKIT_PAT }}
        run: |
          git config --global url."https://x-access-token:${UIKIT_PAT}@github.com/hathawayANdRX105/".insteadOf "ssh://git@github.com/hathawayANdRX105/"
          git config --global url."https://x-access-token:${UIKIT_PAT}@github.com/hathawayANdRX105/".insteadOf "https://github.com/hathawayANdRX105/"
      - name: Install system deps (ripgrep for tools tests, sccache for rustc-wrapper)
        run: sudo apt-get update && sudo apt-get install -y ripgrep sccache
      # Plan-mode / Profile CLI / UI contract anchors used to be re-run here
      # as their own steps (~40s of duplicated work). The test job's reverse
      # dependency closure already guarantees they run whenever they can
      # break: each is an integration test of a workspace package (daemon /
      # kymic / web), and `.githooks/spec/**` is seeded into `web` by
      # `ci_scope.py`. A scope SKIP means no Rust changed, so none of them
      # could have regressed.
      # T1 linear pipe smoke (route-tui §6): real daemon + one full turn over
      # a pipe — zero ESC bytes on stdout, exit 0; unknown --session = one-line
      # error, exit 2; then `session attach` proves the turn landed in the DB.
      # LLM traffic goes to a throwaway SSE test server; credentials come from a
      # workspace .kymido/providers.toml fixture whose row fields the KYMIDO_LLM_*
      # env vars fill in (post-cutover, env alone can no longer mint credentials).
      - name: TUI linear pipe smoke
        run: |
          set -euo pipefail
          cargo build --locked --bin kymido --bin daemon

          TMP="$RUNNER_TEMP/tui-smoke"
          mkdir -p "$TMP"
          export KYMIDO_DAEMON_SOCKET="$TMP/daemon.sock"
          export KYMIDO_DATA_DIR="$TMP"

          cat > "$TMP/test_openai.py" <<'PY'
          import http.server, json, sys

          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get("Content-Length") or 0)
                  self.rfile.read(n)
                  chunk = json.dumps({
                      "choices": [{"delta": {"content": "hello from the test backend"},
                                    "finish_reason": "stop"}]
                  })
                  body = ("data: " + chunk + "\n\n").encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args):
                  pass

          http.server.HTTPServer(("127.0.0.1", int(sys.argv[1])), H).serve_forever()
          PY
          python3 "$TMP/test_openai.py" 18099 &
          STUB_PID=$!
          for _ in $(seq 1 50); do
            if curl -s -m 1 -o /dev/null "http://127.0.0.1:18099/"; then
              break
            fi
            sleep 0.1
          done
          curl -s -m 1 -o /dev/null "http://127.0.0.1:18099/" || {
            echo "test backend did not come up"
            exit 1
          }

          cleanup() {
            ./target/debug/kymido daemon stop >/dev/null 2>&1 || true
            kill "$STUB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          # providers.toml fixture: the credential source is the active provider
          # row; KYMIDO_LLM_* below only override its fields. Without the file the
          # daemon would fall back to the omp worker and CI has no `omp` binary.
          mkdir -p .kymido
          cat > .kymido/providers.toml <<'TOML'
          active = "smoke"

          [providers.smoke]
          TOML
          export KYMIDO_LLM_BASE_URL="http://127.0.0.1:18099"
          export KYMIDO_LLM_API_KEY="test-key"
          export KYMIDO_LLM_MODEL="test-model"
          ./target/debug/kymido daemon start

          # 1) pipe full turn: linear echo, zero ESC bytes, exit 0
          rc=0
          printf '数到三\n' | ./target/debug/kymido tui --tui linear >"$TMP/linear.out" || rc=$?
          echo "--- linear stdout (cat -v) ---"
          cat -v "$TMP/linear.out"
          echo "--- linear exit=$rc ---"
          test "$rc" -eq 0
          ! grep -q $'\x1b' "$TMP/linear.out"
          grep -q "hello from the test backend" "$TMP/linear.out"

          # 2) unknown --session: one-line error, exit 2, no ESC
          rc=0
          ./target/debug/kymido tui --tui linear --session nosuch \
            >"$TMP/nosuch.out" 2>"$TMP/nosuch.err" || rc=$?
          cat "$TMP/nosuch.out" "$TMP/nosuch.err" >"$TMP/nosuch.all"
          echo "--- nosuch combined (cat -v) ---"
          cat -v "$TMP/nosuch.all"
          echo "--- nosuch exit=$rc ---"
          test "$rc" -eq 2
          ! grep -q $'\x1b' "$TMP/nosuch.all"
          test "$(grep -c . "$TMP/nosuch.all")" -eq 1

          # 3) the turn really landed in the session DB (two-sided proof)
          sid=$(./target/debug/kymido --json session list "%" --limit 1 | python3 -c \
            'import json,sys; d=json.load(sys.stdin); rows = d if isinstance(d, list) else (d.get("sessions") or d.get("rows") or []); print(rows[0]["id"])')
          ./target/debug/kymido session attach "$sid" | tee "$TMP/attach.out"
          grep -q "数到三" "$TMP/attach.out"
          grep -q "hello from the test backend" "$TMP/attach.out"

      # T18 PTY smoke (route-tui §3 T18): the TUI's real-terminal evidence,
      # which the pipe smoke above structurally cannot produce — pipe stdin
      # never satisfies the mode probe (TTY + colour + >=44x12), so `kymido tui`
      # would fall back to linear and the enhanced shell would go untested.
      # A real pty at 100x30 with colour support, keystrokes in as bytes, and
      # every wait driven by a sentinel the TUI has actually painted (no bare
      # sleeps guessing at frames, and no waiting for a quiet stream a live
      # TUI never produces).
      #
      # A step here, not its own job: the workspace cold build does not fit
      # in a fresh job's budget (run 36297952884 timed out at 15 min still
      # downloading deps), while this job already builds `kymido` and `daemon`
      # for the pipe smoke above. The step name is what names the regression.
      - name: TUI enhanced pty smoke
        run: |
          set -euo pipefail
          cargo build --locked --bin kymido --bin daemon

          TMP="$RUNNER_TEMP/tui-pty-smoke"
          mkdir -p "$TMP"
          export KYMIDO_DAEMON_SOCKET="$TMP/daemon.sock"
          export KYMIDO_DATA_DIR="$TMP"

          # Same throwaway SSE backend as the pipe smoke above: no API key, no
          # outbound traffic, one full turn available to the daemon.
          cat > "$TMP/test_openai.py" <<'PY'
          import http.server, json, sys

          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get("Content-Length") or 0)
                  self.rfile.read(n)
                  chunk = json.dumps({
                      "choices": [{"delta": {"content": "hello from the pty backend"},
                                    "finish_reason": "stop"}]
                  })
                  body = ("data: " + chunk + "\n\n").encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args):
                  pass

          http.server.HTTPServer(("127.0.0.1", int(sys.argv[1])), H).serve_forever()
          PY
          python3 "$TMP/test_openai.py" 18100 &
          STUB_PID=$!
          for _ in $(seq 1 50); do
            if curl -s -m 1 -o /dev/null "http://127.0.0.1:18100/"; then
              break
            fi
            sleep 0.1
          done
          curl -s -m 1 -o /dev/null "http://127.0.0.1:18100/" || {
            echo "pty test backend did not come up"
            exit 1
          }

          cleanup() {
            ./target/debug/kymido daemon stop >/dev/null 2>&1 || true
            kill "$STUB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Same providers.toml fixture as the pipe step above; the differing
          # port is injected via KYMIDO_LLM_BASE_URL. mkdir -p + `cat >` is
          # idempotent, so it is safe whether or not the pipe step ran first.
          mkdir -p .kymido
          cat > .kymido/providers.toml <<'TOML'
          active = "smoke"

          [providers.smoke]
          TOML
          export KYMIDO_LLM_BASE_URL="http://127.0.0.1:18100"
          export KYMIDO_LLM_API_KEY="test-key"
          export KYMIDO_LLM_MODEL="test-model"
          ./target/debug/kymido daemon start

          # The pty driver: stdlib only (no repo dependency, no extra package).
          #
          # Every wait is sentinel-driven (`must`: read until what we expect
          # is on the screen, optionally holding for HOLD_MS so a half-drawn
          # frame cannot satisfy it). The previous `settle()` waited for the
          # *stream to go quiet* — but the enhanced TUI repaints continuously
          # (measured locally: 19 writes/s, longest gap 72ms, zero 500ms
          # silences in 8s), so quiet never arrived and every wait burned its
          # whole deadline: 115s of dead time, on the job that was already
          # the critical path (226s vs the test job's 191s).
          cat > "$TMP/pty_drive.py" <<'PY'
          import fcntl, os, pty, re, select, struct, sys, termios, time

          CMD = sys.argv[1]
          DEADLINE_S = float(os.environ.get("DEADLINE_S", "20"))
          HOLD_MS = int(os.environ.get("HOLD_MS", "400"))
          COLS, ROWS = 100, 30

          # Alt-screen private modes we can assert on: the enhanced shell must
          # have entered ?1049h and must leave it on exit (a missing ?1049l
          # leaves the runner's shell in a broken state).
          RE_ALT_ENTER = re.compile(rb"\x1b\[\?1049h")
          RE_ALT_LEAVE = re.compile(rb"\x1b\[\?1049l")

          def strip_ansi(data: bytes) -> bytes:
              # Drop CSI/OSC sequences so sentinels match plain text; the
              # terminal palette is not ours to assert on, the words are.
              data = re.sub(rb"\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)", b"", data)
              return re.sub(rb"\x1b\[[0-9;?]*[ -/]*[@-~]", b"", data)

          pid, fd = pty.fork()
          if pid == 0:
              os.environ["TERM"] = "xterm-256color"
              os.environ["COLORTERM"] = "truecolor"
              os.environ["COLUMNS"] = str(COLS)
              os.environ["LINES"] = str(ROWS)
              os.execvp("/bin/sh", ["/bin/sh", "-c", CMD])

          fcntl.ioctl(fd, termios.TIOCSWINSZ, struct.pack("HHHH", ROWS, COLS, 0, 0))

          buf = bytearray()

          def read_once(timeout=0.1):
              """One read attempt: 'data' (something was painted), 'closed'
              (the slave side is gone — the child exited, no more output will
              ever arrive) or 'idle' (nothing within `timeout`)."""
              r, _, _ = select.select([fd], [], [], timeout)
              if not r:
                  return "idle"
              try:
                  chunk = os.read(fd, 65536)
              except OSError:
                  return "closed"
              if not chunk:
                  return "closed"
              buf.extend(chunk)
              return "data"

          def delta_since(mark):
              """Screen text produced after `mark`. The buffer is a
              transcript, not a screen: text painted before `mark` stays in
              it forever, so a palette that has been dismissed is still
              "present" in `buf` and only absent from its tail."""
              return strip_ansi(bytes(buf[mark:]))

          def fail(msg):
              sys.stderr.write("FAIL: %s\n" % msg)
              sys.stderr.write("--- pty output ---\n")
              sys.stderr.write(repr(bytes(buf)) + "\n")
              sys.stderr.flush()
              sys.exit(1)

          def must(label, predicate, hold_ms=0, deadline_s=DEADLINE_S):
              """Read until `predicate()` holds; with `hold_ms` it must keep
              holding that long while the TUI keeps painting. Fails the step
              with the transcript instead of hanging the job."""
              end = time.time() + deadline_s
              ok_since = None
              while time.time() < end:
                  read_once()
                  if predicate():
                      if ok_since is None:
                          ok_since = time.time()
                      if hold_ms == 0 or (time.time() - ok_since) * 1000 >= hold_ms:
                          sys.stdout.write("ok: %s\n" % label)
                          return
                  else:
                      ok_since = None
              fail("timeout after %ss waiting for %s" % (deadline_s, label))

          def pump(ms):
              """Read for a fixed slice of time — only where there is no
              sentinel to wait for (letting queued keystrokes be processed),
              never as a substitute for one."""
              end = time.time() + ms / 1000.0
              while time.time() < end:
                  if read_once(0.05) == "closed":
                      return

          def send(data, label):
              os.write(fd, data)
              sys.stdout.write("sent: %s\n" % label)

          # 1) the shell paints and enters the alternate screen
          must("entered alternate screen (?1049h)",
               lambda: RE_ALT_ENTER.search(bytes(buf)) is not None)

          # 2) the slash-command palette opens on a line-leading '/'
          before = len(buf)
          send(b"/", "'/'")
          must("slash palette lists /help", lambda: b"/help" in delta_since(before))

          # 3) Esc closes the palette again. Judged on what was painted
          #    *after* the key (the transcript still holds the old frame),
          #    and only once HOLD_MS has passed with no palette in it — a
          #    frame still being drawn cannot satisfy that.
          before = len(buf)
          send(b"\x1b", "esc")
          must("slash palette closed (esc)",
               lambda: len(buf) > before and b"/help" not in delta_since(before),
               hold_ms=HOLD_MS)

          # 4) Ctrl+K opens the session picker (T4 key routing at the TTY level)
          before = len(buf)
          send(b"\x0b", "ctrl-k")
          must("picker shows its cancel hint", lambda: b"esc cancel" in delta_since(before))
          before = len(buf)
          send(b"\x1b", "esc")
          must("picker closed (esc)",
               lambda: len(buf) > before and b"esc cancel" not in delta_since(before),
               hold_ms=HOLD_MS)

          # 5) Quit cleanly. Two things this step has to respect about the
          # TUI: Ctrl+C is abort (not quit), and Ctrl+D quits **only when the
          # composer is empty** — the `/` typed for the palette check above
          # is still in it, so clear it first (run 36300305870: the shell
          # never exited). There is no sentinel for "the composer is empty"
          # (an empty composer repaints nothing distinctive), so this is the
          # one fixed soak in the driver: give the backspaces a beat to be
          # handled, then ask for the exit.
          send(b"\x7f" * 16, "backspaces (clear composer)")
          pump(HOLD_MS)
          send(b"\x04", "ctrl-d")

          # Drain and reap together: the teardown bytes (?1049l, cursor
          # show) are written after the last frame and just before the slave
          # side reports EOF, so reading only *after* the wait would miss
          # them and reading only *before* it would exit early.
          deadline = time.time() + 20
          code = None
          while time.time() < deadline:
              state = read_once(0.1)
              done, status = os.waitpid(pid, os.WNOHANG)
              if done:
                  code = os.waitstatus_to_exitcode(status)
                  while read_once(0.05) == "data":   # final drain
                      pass
                  break
              if state == "closed":
                  break
          if code is None:
              # EOF but not reaped yet: the child is gone or going, give it
              # a bounded moment rather than hanging the job on it.
              for _ in range(30):
                  done, status = os.waitpid(pid, os.WNOHANG)
                  if done:
                      code = os.waitstatus_to_exitcode(status)
                      break
                  time.sleep(0.1)
          if code is None:
              sys.stderr.write("tui did not exit after ctrl-d; killing\n")
              os.kill(pid, 9)
              os.waitpid(pid, 0)
              fail("tui did not exit after ctrl-d")
          raw = bytes(buf)
          if RE_ALT_LEAVE.search(raw) is None:
              sys.stderr.write("exit did not leave the alternate screen (?1049l)\n")
              sys.stderr.write(repr(raw) + "\n")
              sys.exit(1)
          if b"panicked at" in raw or b"RUST_BACKTRACE" in raw:
              sys.stderr.write("panic trace leaked into the pty stream\n")
              sys.stderr.write(repr(raw) + "\n")
              sys.exit(1)
          if code != 0:
              sys.stderr.write("tui exited %d, expected 0\n" % code)
              sys.stderr.write(repr(raw) + "\n")
              sys.exit(1)
          sys.stdout.write("ok: exited 0, screen restored, no panic\n")
          # Human-readable transcript for a failed step above.
          sys.stdout.write("--- pty output (cat -v) ---\n")
          sys.stdout.buffer.write(re.sub(rb"\x1b", rb"^[", raw))
          PY

          rc=0
          python3 "$TMP/pty_drive.py" \
            "./target/debug/kymido tui" >"$TMP/pty.log" 2>&1 || rc=$?
          cat "$TMP/pty.log"
          echo "--- pty driver exit=$rc ---"
          exit "$rc"
        timeout-minutes: 15
