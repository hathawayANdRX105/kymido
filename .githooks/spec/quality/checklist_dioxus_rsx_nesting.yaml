# CK-DIOXUS-RSX-NESTING: rsx 块内元素嵌套深度
#
# 为什么: `div { div { div {} } }` 这种裸元素套元素，读的人要在脑子里重建层级，
#   改一处不知道影响哪层。抽成 #[component] 才有名字、能复用、能单测。
# 不管什么: Dioxus 惯用法不在此列，误报它们 agent 会学会无视整条规则——
#   - `prop: rsx! { ... }`   传 slot 片段
#   - `if cond { rsx! {} }`  条件渲染
#   - `.map(|x| rsx! {})`    列表渲染
# 口径: 只数「元素套元素」，用栈逐个花括号判类别，不正则数 `Name {` 的行数。
# 阈值: 峰值 ≥3 层。阈值来自实测——omenic 现状 49 块、ferrite 251 块命中，
#   走 --scope changed 后两仓归零，是纯「不许退化」的新代码守卫。
# 工具: dioxus_web.py（l1 确定性，零 LLM，~1s）
enabled: true
hooks: [pre-push, merge]
sla: l1
fail_severity: WARN
match:
  paths_include: ["**/*.rs"]
  paths_exclude: ["target/", ".wt/", "node_modules/"]
mode: grep
harness:
  command: "python3"
  args:
    - ".githooks/spec/harness/dioxus_web.py"
    - "--only"
    - "nesting"
    - "--scope"
    - "changed"
    - "--nesting-limit"
    - "3"
optional: false
timeout: 60
