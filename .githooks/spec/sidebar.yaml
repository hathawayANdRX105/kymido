# 双栏侧边栏契约：ui-kit DualPaneNav 装配（一级 会话/设置/统计 + 二级菜单映射页面）。
# find 关键字全部取自 kymido rsx 源码中的稳定 class/字面量，由
# bin/web/tests/ui_contract.rs 的「源码锚点抽查」测试自动核对。
name: sidebar
target: crates/web-ui/src/components/dual_sidebar.rs
description: 双栏侧边栏（DualSidebar / SessionTreePanel）——一级 icon rail（会话/设置/统计，kit DualPaneNav）、会话二级 = content 槽装的两级折叠树（项目 → 会话 + 小按钮）、设置/统计二级 = 默认列表映射中栏页面。单栏 Sidebar / 折叠 CollapsedRail / 拖拽调宽已退役。
anchors:
  - key: dual-pane-shell
    find: 'DualPaneNav {'
    expect: '左侧整列用 kit DualPaneNav 装配（icon rail + 二级列表 + 折叠 hover popover + footer 槽）；kymido 只喂组数据与回调，宽度 270/80 由 kit 自管。'
    source: 'kymido: crates/web-ui/src/components/dual_sidebar.rs（DualSidebar）；ui-kit: layout/dual_pane_nav.rs（content 槽自 feat/dual-pane-16）'
  - key: sessions-content-slot
    find: 'content: Some(rsx! {'
    expect: '「会话」组经 DualPaneGroup.content 槽装自定义二级菜单（SessionTreePanel）：动态会话数据装不进静态 DualPaneChild，默认列表留给静态选项组（设置/统计）。'
    source: 'kymido: dual_sidebar.rs（DualSidebar groups）；ui-kit: layout/sidebar_dual.rs（content 槽）'
  - key: wordmark
    find: 'role-card tracking-[0.04em]'
    file: crates/web-ui/src/views/config.rs
    expect: 'kymido 字标 18/24 semibold（品牌身份不进 ui-kit）；双栏侧栏 footer 槽被会话面板接管（2026-10 批注轮）后，字标现挂设置页 About 段。'
    source: 'kymido: crates/web-ui/src/views/config.rs（About 段字标，原挂 dual_sidebar footer 槽）'
  - key: new-session-button
    find: 'IconPlus { size: 15 }'
    expect: '「会话」二级菜单头部小按钮行：搜索钮（nav-search-bar，IconSearch）+ 新建项目钮（ui-kit Button Ghost IconSm，IconPlus）；旧 h34 文字按钮已换成这两个图标小钮。'
    source: 'kymido: dual_sidebar.rs（SessionTreePanel 小按钮行）'
  - key: cmdk-search
    find: 'nav-search-bar'
    expect: '「会话」二级菜单搜索钮挂 nav-search-bar hook class，⌘K/Ctrl+K 全局触发快速切换。'
    source: 'kymido: dual_sidebar.rs（SessionTreePanel）+ bin/web/src/app.rs（keydown 处理）'
  - key: project-row
    find: 'h-[34px] mx-0 px-2 rounded-lg flex items-center gap-2'
    expect: '项目行 h34、r8，folder 图标 + 名称 + hover 新建/移除钮 + 会话计数；点击切 active space 并折叠/展开该项目会话。'
    source: 'kymido: dual_sidebar.rs（SessionTreePanel，markup 同源旧单栏侧栏项目行）'
  - key: session-row
    file: crates/web-ui/src/components/session_row.rs
    find: 'group h-8 px-2 rounded-lg flex items-center gap-2'
    expect: '会话行 h32、r8，激活态 bg-accent 常亮；运行中会话左侧旋转指示；删除钮 hover 行才出现且排在行最右。'
    source: 'kymido: crates/web-ui/src/components/session_row.rs（SessionRow）'
  - key: run-indicator
    file: crates/web-ui/src/components/session_row.rs
    find: 'Spinner { size: 12, class: "text-brand shrink-0" }'
    expect: '会话状态为 Active（事件流实时写入）时行左侧显示 ui-kit Spinner 旋转加载图标；非运行态不渲染。'
    source: 'kymido: session_row.rs（SessionRow，status == SessionStatus::Active 条件渲染）'
  - key: hover-row-actions
    file: crates/web-ui/src/components/session_row.rs
    find: 'opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer bg-transparent border-none'
    expect: '会话行/项目行删除（🗑）钮默认完全隐藏（opacity-0），hover 行才在行最右出现。'
    source: 'kymido: session_row.rs（SessionRow 删除钮）+ dual_sidebar.rs 项目行移除钮'
  - key: session-indent
    find: 'pl-[22px] flex flex-col gap-px pb-1'
    expect: '会话行相对项目行缩进 22px。'
    source: 'kymido: dual_sidebar.rs（SessionTreePanel 会话列容器）'
  - key: session-tree-group
    find: 'fn group_sessions(sessions: &[Session]) -> Vec<(&Session, usize)>'
    expect: '扁平列表按 parent_id 组渲染树：父在前、子紧随其后；父不在本列表当根，成环/超深由 visited 与深度上限截断。'
    source: 'kymido: dual_sidebar.rs（group_sessions，自 sidebar.rs 平移）；kymido 自研——dsh 侧会话列表无谱系分组控件'
  - key: child-indent
    find: 'pl-[18px]'
    expect: '子会话行相对父行再缩进 18px（层级 1；2/3 层 36/54px，再深封顶）。'
    source: 'kymido: dual_sidebar.rs（depth_indent_class，自 sidebar.rs 平移）；kymido 自研'
  - key: hidden-scrollbar
    find: 'no-scrollbar'
    expect: '会话树容器保留滚动但隐藏滚动条（no-scrollbar utility，见 bin/web/assets/tailwind-input.css）。'
    source: 'kymido: dual_sidebar.rs（SessionTreePanel 树容器）+ bin/web/assets/tailwind-input.css'
  - key: settings-default-list
    find: 'id: "models"'
    expect: '「设置」二级菜单 = 默认列表（模型与渠道 / MCP 服务器 / 关于），点击映射中栏设置页分区（SettingsPage）；弹窗形态已删。'
    source: 'kymido: dual_sidebar.rs（DualSidebar settings 组）'
  - key: stats-default-list
    find: 'sh::TTL_STATS'
    expect: '「统计」顶层为叶子页（假时间范围二级列表已删）；时间范围在统计页内由胶囊（SegmentedCapsule）切换，选中写 stats_range 信号。'
    source: 'kymido: dual_sidebar.rs（统计组 children: Vec::new()）+ stats.rs（胶囊）'
notes: |
  单栏侧栏（logo 行 / 底部统计设置行 / 56px 折叠 rail / 右缘拖拽条）随本次
  双栏化全部退役；折叠态 = kit DualPaneNav rail（80px）+ hover popover。
  状态点三色映射（status_dot_class）随 CollapsedRail 一并删除。会话树两个
  分组锚点（session-tree-group / child-indent）为 5.3/5.5 谱系分组，自
  sidebar.rs 平移到 dual_sidebar.rs，不变式不变。
