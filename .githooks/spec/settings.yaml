# 设置页面契约：dsh SettingsRoot 提级为中栏页（分区由侧栏二级菜单选定）。
# find 关键字全部取自 kymido rsx 源码中的稳定 class/字面量，由
# bin/web/tests/ui_contract.rs 的「源码锚点抽查」测试自动核对。
name: settings
target: crates/web-ui/src/views/config.rs
description: 设置页面（SettingsPage + 模型与渠道 / MCP 服务器 / 关于 三区 pane）——800px 弹窗与 188px 内导航已退役，分区改由侧栏「设置」二级菜单写入 settings_section 信号；表单（含 Fallback 路由行列表）、MCP 服务器卡列表、关于页版本号保持不变。
anchors:
  - key: settings-page
    find: 'pub fn SettingsPage('
    expect: '中栏设置页（SettingsPage）：区头 + 按 settings_section 信号渲染对应 pane；弹窗壳（Modal + 内导航 + 关闭钮）已删。'
    source: 'kymido: crates/web-ui/src/views/config.rs（SettingsPage，自 SettingsModal 提级）'
  - key: settings-section
    file: crates/web-ui/src/nav.rs
    find: 'pub enum SettingsSection {'
    expect: '设置分区枚举（Models / Mcp / About）：侧栏「设置」二级菜单选项 ↔ 页面分区一一对应（from_id 映射菜单行 id）。'
    source: 'kymido: crates/web-ui/src/nav.rs（SettingsSection，0d2db80 自 config.rs 下沉）'
  - key: modal-radius
    file: crates/web-ui/src/components/ui.rs
    find: 'rounded-2xl border border-border bg-card shadow-xl'
    expect: 'Modal 卡片 r16（ui-kit token 系）：⌘K 快速切换弹窗仍用 ui.rs Modal 壳。'
    source: 'kymido: crates/web-ui/src/components/ui.rs（Modal）；设置弹窗形态退役后 Modal 仅剩快速切换消费'
  - key: section-header
    find: 'h-[54px] px-6 flex items-center justify-between border-b border-border'
    expect: '设置页区头 54px：分区标题（settings_section.label）；关闭钮随弹窗删除。'
    source: 'kymido: crates/web-ui/src/views/config.rs（SettingsPage 区头）'
  - key: form-input
    find: 'w-full h-9 rounded-[10px] bg-secondary border border-border px-3'
    expect: '表单输入统一 h36、r10、layer-2 底，focus 时 brand 边框。'
    source: 'kymido: crates/web-ui/src/views/config.rs（ConfigForm input_class）'
  - key: model-cards
    find: 'grid grid-cols-2 gap-2.5'
    expect: '在线模型卡两列网格，当前默认卡 brand 边框 + success「默认」chip。'
    source: 'kymido: crates/web-ui/src/views/config.rs（ConfigForm 在线模型区）'
  - key: about-version
    find: 'env!("CARGO_PKG_VERSION")'
    expect: '「关于」分区展示编译期版本号（v{CARGO_PKG_VERSION} chip）。'
    source: 'kymido: crates/web-ui/src/views/config.rs（AboutPane）'
  - key: mcp-section-label
    find: 'MCP 服务器'
    expect: '「MCP 服务器」分区：侧栏二级菜单行文案与页内 pane 标题同源（LBL_MCP_SERVERS / pane 标题）。'
    source: 'kymido: shared.rs（LBL_MCP_SERVERS）+ config.rs（McpServersPane 页头）'
  - key: mcp-server-card
    find: 'bg-card border border-border rounded-xl px-4 py-4 flex flex-col gap-3'
    expect: 'MCP 服务器卡容器：layer-1 底、r12 圆角、纵向 gap-3；卡头 name + stdio/http 摘要 + 删除钮，卡体两列字段网格。'
    source: 'kymido: crates/web-ui/src/views/config.rs（McpServerCard card_class）'
  - key: mcp-add-server
    find: '添加 MCP 服务器'
    expect: '「添加 MCP 服务器」按钮：向表单追加一张空白服务器卡（Outline 变体）。'
    source: 'kymido: crates/web-ui/src/views/config.rs（McpServersPane 页头行）'
  - key: fallback-route-row
    find: 'other-provider/model-id'
    expect: 'Fallback 路由行的路由输入（font-mono，placeholder other-provider/model-id）：每行一条「provider/model」路由文本 + 序号 + 删除钮（T6 providers 化后取代 4 字段 Fallback Provider 卡）。'
    source: 'kymido: crates/web-ui/src/views/config.rs ConfigForm Fallback 路由卡（route 行 input placeholder）；providers.toml 的 [[providers.X]] fallbacks 键'
  - key: llm-fallback-add
    find: '添加 Fallback 路由'
    expect: '「添加 Fallback 路由」按钮（Outline 变体，卡在区头行右侧）：向表单追加一条空白路由行。'
    source: 'kymido: crates/web-ui/src/views/config.rs ConfigForm Fallback 路由卡区头行'
notes: |
  表单校验/保存逻辑（save_to_file、test_connection）不在本契约内；
  锚点只锁页面几何与输入样式。800px 弹窗壳与 188px 内导航随设置页
  提级删除（分区选择改由侧栏二级菜单承担，见 sidebar.yaml 的
  settings-default-list 锚点）。
