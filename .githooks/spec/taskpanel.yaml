# 任务 dock 契约：composer 上方任务看板卡片（宽随消息列）。
# find 关键字全部取自 omenic rsx 源码中的稳定 class/字面量，由
# bin/web/tests/ui_contract.rs 的「源码锚点抽查」测试自动核对。
name: taskpanel
target: crates/web-ui/src/components/taskpanel.rs
description: 任务看板 dock（TaskPanel / FilterChip）——r16 浮层卡、h1 进度条、h26 r7 filter chip、r10 任务卡。
anchors:
  - key: dock-card
    find: 'w-full rounded-2xl border border-binv bg-layer-2 shadow-lv2 overflow-hidden'
    expect: 'dock 卡 r16（rounded-2xl）、layer-2 底、lv2 阴影，宽度随父容器。'
    source: 'omenic: crates/web-ui/src/components/taskpanel.rs:37'
  - key: width-follows-column
    file: crates/web-ui/src/components/chat.rs
    find: 'max-w-[780px] px-4 pb-2 flex flex-col items-center gap-2'
    expect: 'dock 挂在 composer 悬浮列内，宽随消息列（max-w 780 之内），位于状态行与输入卡之间。'
    source: 'omenic: crates/web-ui/src/components/chat.rs:149（dock 座位）,155（{dock} 槽位）'
  - key: panel-header
    find: 'flex items-center justify-between pl-4 pr-2 py-1.5 border-b border-b1'
    expect: '头部：任务看板标题 + n/m 完成计数 + 28px 圆形关闭钮。'
    source: 'omenic: crates/web-ui/src/components/taskpanel.rs:39-44'
  - key: progress-track
    find: 'h-1 bg-layer-3'
    expect: '进度条轨道高 1px（4px 视觉随层叠），bg-layer-3。'
    source: 'omenic: crates/web-ui/src/components/taskpanel.rs:47'
  - key: progress-fill
    find: 'h-full bg-brand transition-all'
    expect: '进度填充为品牌蓝，宽度随完成百分比过渡。'
    source: 'omenic: crates/web-ui/src/components/taskpanel.rs:48'
  - key: filter-chip
    find: 'h-[26px] px-[7px] rounded-[7px] text-[12px] leading-[18px]'
    expect: '过滤 chip h26、r7、12/18 文案，激活态 bg-ihover。'
    source: 'omenic: crates/web-ui/src/components/taskpanel.rs:150-152（FilterChip）；dsh: compact chip h26 r7'
  - key: task-card
    find: 'rounded-[10px] border border-b1 bg-layer-1 px-3 py-2.5'
    expect: '任务卡 r10、layer-1 底，选中态 brand 边框并展开描述/验收标准。'
    source: 'omenic: crates/web-ui/src/components/taskpanel.rs:97-99'
notes: |
  状态/优先级 chip 复用 chat.yaml 的四色映射（bg-chip-brand/success/
  warn/danger），不在本文件重复锚点。
