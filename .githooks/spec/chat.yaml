# 会话区契约：dsh ConversationRoot 复刻（消息列 / 气泡 / 工作过程 / composer）。
# find 关键字全部取自 kymido rsx 源码中的稳定 class/字面量，由
# bin/web/tests/ui_contract.rs 的「源码锚点抽查」测试自动核对。
name: chat
target: crates/web-ui/src/components/chat.rs
description: 会话区（Chat / MessageItem / ProcessBlock / ToolLine）——780 消息列、用户右气泡 r22、工作过程折叠、composer 胶囊卡。
anchors:
  - key: message-column
    find: 'max-w-[780px] w-full mx-auto px-4 pt-4 pb-[220px]'
    expect: '消息列为居中限宽容器（实现统一 780；dsh 消息列 748，见 notes 偏差记录）。'
    source: 'kymido: crates/web-ui/src/components/chat.rs:92；dsh: ConversationRoot.module.css:22（--dsh-chat-content-width: 748px）'
  - key: user-bubble
    file: crates/web-ui/src/components/message.rs
    find: 'bg-secondary rounded-[22px] px-4 py-2.5 max-w-[525px]'
    expect: '用户气泡 bg-secondary（#2c2c2e）、r22、内边距 10/16、最大宽 525。'
    source: 'kymido: crates/web-ui/src/components/message.rs:47（4146126 自 chat.rs 拆出消息树）；dsh: MessageItem.module.css:17-27（bubble r22 pad 10/16 max-width 525）'
  - key: bubble-right-align
    file: crates/web-ui/src/components/message.rs
    find: 'flex flex-col items-end gap-1 w-full group'
    expect: '用户消息整行右对齐（items-end），气泡下挂 hover 时间戳。'
    source: 'kymido: crates/web-ui/src/components/message.rs:31（4146126 自 chat.rs 拆出）；dsh: MessageItem.module.css userRow（align-items: flex-end）'
  - key: assistant-body
    file: bin/web/assets/tailwind-input.css
    find: 'line-height: 28px;'
    expect: 'assistant 正文 markdown-body 16/28。'
    source: 'kymido: bin/web/assets/tailwind-input.css:152-158；dsh: AssistantMarkdown 16/28 规格'
  - key: process-header
    file: crates/web-ui/src/components/message.rs
    find: 'h-6 flex items-center gap-1.5 cursor-pointer select-none w-fit'
    expect: '「Work Process」折叠行高 24px，无 chevron（ainotation #2 删除），计数为 caption 弱化文本；最后一轮默认展开、更早轮静止折叠（#4-6）。'
    source: 'kymido: crates/web-ui/src/components/message.rs:161（ProcessBlock，4146126 自 chat.rs 拆出）；dsh: DisclosureRow.module.css:15（头高 24px）'
  - key: process-title
    file: crates/web-ui/src/components/message.rs
    find: 'sh::LBL_WORK_PROGRESSING'
    expect: '折叠块头行：进行中动词形 Progressing（shimmer-text）/ 结束后名词形 Progress（sh::LBL_WORK_PROGRESSING / LBL_WORK_PROGRESS，ainnotation 波4 #1；旧「Work Process」字面量已删）。'
    source: 'kymido: message.rs（ProcessBlock 头行）+ shared.rs（LBL_WORK_PROGRESSING/LBL_WORK_PROGRESS）；ainnotation 波4 #1'
  - key: tool-row-header
    file: crates/web-ui/src/components/message.rs
    find: 'h-6 flex items-center gap-2 cursor-pointer select-none w-full'
    expect: '单条工具调用行（ToolLine）头高 24px，与工作过程行同构；头行 = kind 图标 + 大写 kind 文本 + 「·」+ 命令标题，无 chevron（ainotation #2/#4）。'
    source: 'kymido: crates/web-ui/src/components/message.rs:209（ToolLine，4146126 自 chat.rs 拆出）；dsh: DisclosureRow.module.css:15（24px 头）'
  - key: tool-chip
    file: crates/web-ui/src/components/message.rs
    find: 'font-mono role-overline shrink-0'
    expect: '工具 kind 标签：纯文本（无 chip 底/边框，ainotation #4-1）、mono 10px 大写、首字母大写显示（#4-2），颜色走 400 字级 token，shrink-0。'
    source: 'kymido: crates/web-ui/src/components/message.rs:215；dsh: 状态色 400 字规格'
  - key: tool-kind-icon
    file: crates/web-ui/src/components/message.rs
    find: 'KindIcon { kind: "{tool.kind}" }'
    expect: 'kind 前挂一个 12px、text-muted-foreground 的类型图标（ainotation #4-4；字形映射语义对齐 dsh GenericToolCard VARIANT_ICONS）。'
    source: 'kymido: crates/web-ui/src/components/chat.rs:92-102（KindIcon 定义）+ message.rs:214（4146126 调用点自 chat.rs 拆出）；dsh: GenericToolCard.tsx VARIANT_ICONS'
  - key: tool-kind-sep
    file: crates/web-ui/src/components/message.rs
    find: 'span { class: "role-caption shrink-0", "·" }'
    expect: 'kind 标签与命令标题之间插「·」分隔符（ainotation #4-3）。'
    source: 'kymido: crates/web-ui/src/components/message.rs:218；ainotation #4 第 3 条'
  - key: chip-kind-bash
    find: '"bash" | "job" | "terminal" => "text-brand-300"'
    expect: 'bash / job / terminal 类工具 kind 文本同为 brand-300 字色（三者都是「跑命令」，靠 kind 文字区分，不靠颜色；chip 底已按 #4-1 删除）。'
    source: 'kymido: crates/web-ui/src/components/chat.rs:25；dsh: kind→状态色 400 字映射'
  - key: chip-kind-edit
    find: '"edit" | "write" => "text-success-foreground"'
    expect: 'edit/write 类工具 kind 文本为 success-2 字色。'
    source: 'kymido: crates/web-ui/src/components/chat.rs:26；dsh: kind→状态色映射'
  - key: chip-kind-read
    find: '"read" | "grep" | "glob" => "text-warning-foreground"'
    expect: 'read/grep/glob 类工具 kind 文本为 warn-2 字色。'
    source: 'kymido: crates/web-ui/src/components/chat.rs:27；dsh: kind→状态色映射'
  - key: chip-kind-delete
    find: '"delete" => "text-destructive"'
    expect: 'delete 类工具 kind 文本为 danger 字色。'
    source: 'kymido: crates/web-ui/src/components/chat.rs:28；dsh: kind→状态色映射'
  - key: statsline
    find: 'role-caption text-center select-none'
    expect: 'StatsLine 状态行 12/20 tertiary 居中：model · ↑in ↓out · $cost · context %；单行 12px 居中，置于输入卡下方一行（ainnotation 波3 #4 由卡上方移到下方）。'
    source: 'kymido: crates/web-ui/src/components/chat.rs:151；dsh: StatsLine.module.css:8-16（center 12px/20px tertiary）'
  - key: composer-card
    find: 'rounded-[24px] border border-border bg-background shadow-lv2'
    expect: 'composer 输入卡 r24 胶囊（max-w 780 随消息列），focus-within 提亮边框。'
    source: 'kymido: crates/web-ui/src/components/chat.rs 输入卡段；dsh: InputBar.module.css（胶囊卡）'
  - key: send-button
    find: 'IconArrowUp { size: 16 }'
    expect: '发送钮两态：空闲（输入空置灰 bg-secondary-hover cursor-default）/ 可发（32px 圆形 bg-brand + hover 提亮 + active 缩放），点击发送并清草稿。'
    source: 'kymido: crates/web-ui/src/components/chat.rs 发送钮段；dsh: InputBar.module.css（圆形发送钮）'
  - key: stop-button
    find: 'title: sh::BTN_STOP'
    expect: '运行态停止钮 32px 圆形 bg-brand + 白色 Spinner 14px 描边环（stop-button-spinner），is_streaming 时同位替换静止态发送钮。'
    source: 'kymido: crates/web-ui/src/components/chat.rs 发送/停止钮段；ainnotation 波3 #3'
  - key: stop-button-spinner
    find: 'Spinner { size: 14, class: "text-white" }'
    expect: '运行态动态效果：ui-kit Spinner 14px animate-spin 描边环替代旧白色小方块，表达「正在跑」（ainnotation 波3 #3）。'
    source: 'kymido: crates/web-ui/src/components/chat.rs 停止钮；ui-kit Spinner'
  - key: picker-no-chevron
    file: crates/web-ui/src/components/menu_picker.rs
    find: 'span { class: "{mono_class}", "{label}" }'
    expect: '模型/思考 MenuPicker 触发钮体内仅 label span，无右侧 chevron 图标（ainnotation 波3 #1/#2 删除），点击展开不变。'
    source: 'kymido: crates/web-ui/src/components/menu_picker.rs:37（MenuPicker，4146126 自 chat.rs 拆出）；ainnotation 波3 #1/#2'
  - key: composer-click-outside
    find: 'onclick: move |_| on_outside_tasks.call(())'
    expect: '「点外关闭」事件委托：chat 列根节点收 click → 页面层关闭任务 dock（ainnotation 波3 #5）；面板内部与开合钮 stop_propagation 豁免。'
    source: 'kymido: crates/web-ui/src/components/chat.rs Chat 根节点；接线在 views/workspace.rs'
  - key: task-toggle-guard
    find: 'on_toggle_tasks.call(())'
    expect: '任务看板开合钮保持纯 toggle 语义：stop_propagation 后调 on_toggle_tasks，点外关闭不抢该点击（ainnotation 波3 #5）。'
    source: 'kymido: crates/web-ui/src/components/chat.rs composer 工具栏任务看板钮'
  - key: tool-button-28
    find: 'IconSquareCheck { size: 15 }'
    expect: 'composer 工具钮（附件 IconPaperclip / 任务看板 IconSquareCheck）32px 圆形（旧 ui-kit Button IconSm 28px 已改裸 button），无 run 时看板钮 opacity-40 置灰不可用。'
    source: 'kymido: crates/web-ui/src/components/chat.rs 工具钮段；dsh: InputBar.module.css（圆钮几何）'
  - key: minimap
    find: 'id: "minimap"'
    expect: '左侧 minimap 锚点列（每条用户 prompt 一条横杠，客户端 JS 聚光梯度 + hover popover + click 平滑跳转，ainotation 波2 #3）。'
    source: 'kymido: crates/web-ui/src/components/chat.rs:128 + bin/web/src/app.rs setupMinimap'
  - key: minimap-popover
    find: '"data-tip": ""'
    expect: '每个 minimap 条容器内嵌一个服务端渲染的 prompt 文本 popover（r12 border bg-popover shadow-lv3、pointer-events-none、默认 display:none），hover 时由 app.rs minimap JS 显示（ainotation 波2 #3-1）。'
    source: 'kymido: crates/web-ui/src/components/chat.rs minimap 段；bin/web/src/app.rs mouseover/mouseout'
  - key: minimap-click-jump
    file: bin/web/src/app.rs
    find: "mm.addEventListener('click'"
    expect: '点击 minimap 条 → scrollToIdx → scrollIntoView smooth，平滑滚到 data-anchor 指向的用户 prompt（ainotation 波2 #3-2）。'
    source: 'kymido: bin/web/src/app.rs setupMinimap click 监听'
  - key: tool-output-format
    find: 'pub fn format_tool_output('
    expect: '工具输出渲染前经 format_tool_output 规整：单行转义文本的 \n \t \r 反转义为真实字符，已含真实换行者原样返回（ainotation 波2 #4-1；单测 crates/web-ui/tests/tool_output.rs）。'
    source: 'kymido: crates/web-ui/src/components/chat.rs format_tool_output'
  - key: tool-output-block
    file: crates/web-ui/src/components/message.rs
    find: 'tool-output bg-codeblock rounded-lg px-3 py-2 font-mono role-caption whitespace-pre-wrap break-all'
    expect: '工具输出体为等宽终端样式块（bg-codeblock、font-mono 12/18、真实换行 pre-wrap），逐行着色：diff +/- 绿红、@@ 蓝、$ 命令行高亮（text-foreground）、error/panic/fatal/failed 行 danger（ainotation 波2 #4-2/3）。'
    source: 'kymido: crates/web-ui/src/components/message.rs:237（ToolLine 展开体，4146126 自 chat.rs 拆出）'
  - key: md-table-layout
    file: bin/web/assets/tailwind-input.css
    find: 'width: max-content;'
    expect: 'markdown 表格 display:block + width:max-content + overflow-x:auto：列宽按内容分配，超宽整表横滚，单元格不挤压；td vertical-align:top + overflow-wrap:anywhere（ainotation 波2 #5）。'
    source: 'kymido: bin/web/assets/tailwind-input.css .markdown-body table 块'
  - key: question-card
    find: 'question-card rounded-[14px] border border-border bg-card shadow-lv2'
    expect: '用户问题卡（plan-mode review）：composer 上方、dock 之下，r14 卡片 + 品牌蓝「计划评审」标签 + 选项钮 h28 r8；无问题时整卡不渲染。'
    source: 'kymido: crates/web-ui/src/components/chat.rs（P1 plan-mode 批次新增；dsh 无对应组件，官方 packages/plan/plan-mode 的 review 卡为参考形态）'
  - key: empty-state
    find: 'sh::MSG_EMPTY_CHAT_TITLE'
    expect: '空会话态：26px semibold 标题（文案取 shared const MSG_EMPTY_CHAT_TITLE）+ 420px 限宽副文案 + 品牌光斑。'
    source: 'kymido: crates/web-ui/src/components/chat.rs:236（标题 class；文案 crates/web-ui/src/shared.rs:54 MSG_EMPTY_CHAT_TITLE 随 4146126 抽为 const）'
notes: |
  已知偏差（报告不改）：dsh 消息列 748px（ConversationRoot.module.css
  --dsh-chat-content-width），kymido 实现把消息列与 composer 统一为
  max-w-[780px]。验收时以 780 为准。
  数据接线（on_send/mock 流）由 5.2a 分支负责，锚点只锁样式与静态结构。
