# 快速切换器契约：⌘K 弹出会话切换（560px 顶部对齐面板）。
# find 关键字全部取自 omenic rsx 源码中的稳定 class/字面量，由
# bin/web/tests/ui_contract.rs 的「源码锚点抽查」测试自动核对。
name: quick-switcher
target: crates/web-ui/src/views/workspace.rs
description: 快速切换（Workspace 内 ⌘K Modal）——560px 顶部对齐、h11 搜索输入、h10 会话行、ESC 退出。
anchors:
  - key: width
    find: 'w-[560px]'
    expect: '面板宽 560px。'
    source: 'omenic: crates/web-ui/src/views/workspace.rs:478；dsh: 快速切换面板宽度'
  - key: top-aligned
    find: 'top_aligned: true'
    expect: '面板顶部对齐（pt-[14vh]）而非垂直居中，贴近 dsh command palette 形态。'
    source: 'omenic: crates/web-ui/src/views/workspace.rs:478 + crates/web-ui/src/components/ui.rs:253-257（Modal align）'
  - key: search-input
    find: 'w-full h-11 rounded-xl bg-layer-1 border border-b2 px-4'
    expect: '搜索输入 h44、r12、layer-1 底，focus 时 brand 边框，autofocus。'
    source: 'omenic: crates/web-ui/src/views/workspace.rs:481'
  - key: session-row
    find: 'h-10 px-3 rounded-[10px] flex items-center justify-between'
    expect: '会话行 h40、r10，激活项 bg-ihover 常亮，右侧 mono 会话 id。'
    source: 'omenic: crates/web-ui/src/views/workspace.rs:507-509'
  - key: row-status-dot
    find: 'w-2 h-2 rounded-full {dot} shrink-0'
    expect: '行首 8px 状态点（brand/dim/danger，与侧栏同映射）。'
    source: 'omenic: crates/web-ui/src/views/workspace.rs:524'
  - key: filter-footer
    find: '选择会话快速切换'
    expect: '底部提示行「选择会话快速切换 + ESC 退出」，kbd 样式键帽。'
    source: 'omenic: crates/web-ui/src/views/workspace.rs:533-538'
  - key: cmdk-search
    file: crates/web-ui/src/components/sidebar.rs
    find: 'nav-search-bar'
    expect: '入口为侧栏区头搜索钮（nav-search-bar hook），⌘K/Ctrl+K 全局触发。'
    source: 'omenic: crates/web-ui/src/components/sidebar.rs:104 + bin/web/src/app.rs keydown'
notes: |
  过滤逻辑（search_query contains 匹配）不在本契约内；锚点只锁面板
  几何与行结构。
