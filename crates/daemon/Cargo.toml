[package]
name = "daemon"
version = "0.1.0"
edition = "2024"
description = "Headless kymido daemon: JSONL socket protocol, single-instance lifecycle, persistent session/run state"
license = "MIT"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
libc = "0.2"
fs2 = { workspace = true }
llm = { path = "../llm" }
subagent = { path = "../subagent" }
session = { path = "../session" }
config = { path = "../config" }
mcp = { path = "../mcp" }
tools = { path = "../tools" }
store = { path = "../store" }
protocol = { path = "../protocol" }
plugin = { path = "../plugin" }
jobs = { path = "../jobs" }
terminal = { path = "../terminal" }
agent-loop = { path = "../agent-loop" }
plan-mode = { path = "../plan-mode" }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
ctrlc = { workspace = true, features = ["termination"] }

[dev-dependencies]
tempfile = { workspace = true }
libc = "0.2"
