[package]
name = "session"
version = "0.1.0"
edition = "2024"
description = "Local libSQL-backed session/message store (sessions + messages, JSONL-migration-ready)"
license = "MIT"
publish = false

[dependencies]
libsql = { version = "0.9", default-features = false, features = ["core"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
parking_lot = "0.12"
zstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Both are already regular dependencies of this crate at the same versions,
# so listing them here adds no new resolution to Cargo.lock. The lineage
# tests need them to build a pre-G7 database file by hand (see
# tests/lineage.rs) — that is the only way to reach the migration's ALTER
# branch, since a file created by current code gets `parent_id` from
# `CREATE TABLE` and never exercises it. `rt` (current-thread only) drives
# that one bootstrap; the test itself stays a plain `#[test]`.
libsql = { version = "0.9", default-features = false, features = ["core"] }
tokio = { version = "1", default-features = false, features = ["rt"] }