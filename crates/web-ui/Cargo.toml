[package]
name = "web-ui"
edition = "2024"
version = "0.1.0"
publish = false
description = "kymido Web UI —— Dioxus LiveView 前端：components / views / layouts / utils"

[dependencies]
# 共享投影层与 daemon 客户端（tui 也用，故不在本 crate 内）
web-client = { path = "../web-client" }
web-state = { path = "../web-state" }
# ferrite 家族共享设计系统（shadcn token 桥 + Dioxus 基元）。dioxus 版本与 kit
# 的 =0.7.10 钉齐，双版本会导致 Element 类型不通。
# rev 钉 kit 双栏侧栏 content 槽 + DualPaneGroupList（0036597，feat/dual-pane-16；
# 是 8937af0 的后继：含 main 8b2b52b + css-contract 修复 321e7ea + 双栏槽位）。
# https 形式：ssh 对本机不通（cargo git fetch 挂），仓可匿名读。
ui-kit = { git = "https://github.com/hathawayANdRX105/ui-kit.git", rev = "0036597df516dae85b7ccf0f913fb798a176dfa4" }
dioxus = { version = "0.7" }
pulldown-cmark = { workspace = true }
ammonia = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
