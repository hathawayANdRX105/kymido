[package]
name = "kymido-tui"
version = "0.1.0"
edition = "2024"
description = "kymido tui - terminal chat front-end (T1: linear minimal viable)"
license = "MIT"
publish = false

[dependencies]
web-client = { path = "../web-client" }
web-state = { path = "../web-state" }
# T15：`[tui] notify_osc9` 经 config crate 读定——`.kymido/config.toml` 的解析
# 单一权属 config crate（route §1 T15/T17 追记），TUI 不自解析同款 TOML
#（D18 复制实现）；读不到按默认关（`osc9_from_config`）。
config = { path = "../config" }
clap = { workspace = true }
crossterm = { workspace = true }
# T1 不 import（T2 全屏渲染用）：P1 已批的两行 workspace 依赖随本 crate
# 入锁，T2 接线时直接可用，不再动根 Cargo.toml（route §9 所有权表）。
ratatui = { workspace = true }
# T23：断行按显示格宽算（`chars().count()` 把 CJK/emoji 算成 1 格，
# 渲出来的行宽翻倍，计数侧与画面脱节 → 滚动模型整体错位）。
unicode-width = { workspace = true }
# T26/T27：markdown 解析（Text part）与统一 diff 解析（edit 类工具结果）。
# 两者都已在 [workspace.dependencies]，锁文件里本就有，这里只是让 tui 合法直引。
pulldown-cmark = { workspace = true }
diffy = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
