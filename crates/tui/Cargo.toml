[package]
name = "kymido-tui"
version = "0.1.0"
edition = "2024"
description = "kymido tui - terminal chat front-end (T1: linear minimal viable)"
license = "MIT"
publish = false

[dependencies]
web-client = { path = "../web-client" }
web-state = { path = "../web-state" }
# T15：`[tui] notify_osc9` 经 config crate 读定。配置解析的单一权属在 config
# crate，TUI 不自解析同款 TOML（D18 复制实现）；读不到按默认关
#（`osc9_from_config`）。
config = { path = "../config" }
clap = { workspace = true }
crossterm = { workspace = true }
# T1 不 import（T2 全屏渲染用）：P1 已批的两行 workspace 依赖随本 crate
# 入锁，T2 接线时直接可用，不再动根 Cargo.toml（route §9 所有权表）。
ratatui = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
