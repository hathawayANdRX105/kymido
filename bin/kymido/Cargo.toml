[package]
name = "kymic"
version = "0.1.0"
edition = "2024"
description = "Task-driven agent orchestrator CLI"
license = "MIT"

[[bin]]
name = "kymido"
path = "src/main.rs"

[dependencies]
llm = { path = "../../crates/llm" }
tools = { path = "../../crates/tools" }
store = { path = "../../crates/store" }
agent-loop = { path = "../../crates/agent-loop" }
config = { path = "../../crates/config" }

subagent = { path = "../../crates/subagent" }
mcp = { path = "../../crates/mcp" }
daemon = { path = "../../crates/daemon" }
session = { path = "../../crates/session" }
tui = { path = "../../crates/tui", package = "kymido-tui" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
[dev-dependencies]
tempfile = { workspace = true }
