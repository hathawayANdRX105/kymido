# boot profile -- 最小可跑:一个 orbit worker + 本地 daemon。
# 用法:kymido profile apply boot(.kymido/config.toml 已存在时拒绝覆盖,不动你的配置)。
# 凭据与模型能力在兄弟文件 .kymido/providers.toml(本 profile 同时生成模板):
# 把 providers 行的 base_url + api_key(或 api_key_env)填上即可开聊。
omp_path = "omp"
data_dir = "./.kymido"
model = "default"
[daemon]
# AGENTS.md 发现根;缺省取 daemon 启动目录。
cwd = "."
# 每轮 LLM 往返上限;缺省 orbit 自己的默认值。
max_turns = 64
